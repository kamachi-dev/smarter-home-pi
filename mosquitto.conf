# Mosquitto MQTT Broker Configuration for Smarter Home Pi
# Place this in /etc/mosquitto/conf.d/smarter-home.conf or run via Docker

# Standard MQTT listener for Sub-Controller & local hardware daemons
listener 1883
allow_anonymous true

# MQTT over WebSockets listener for Web Clients & Dashboard streaming
listener 9001
protocol websockets
allow_anonymous true

# Persistence & logging
persistence true
persistence_location /var/lib/mosquitto/
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
